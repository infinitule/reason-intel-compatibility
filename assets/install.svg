<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="t d"><title id="t">Install in four steps</title><desc id="d">Download the DMG, open it, drag Reason to Applications, then open Reason from Applications.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#557c9f" stroke-width="1.5"/></marker></defs><rect width="1200" height="210" rx="20" fill="#f0f6fc"/><g font-family="Arial, Helvetica, sans-serif">
<g stroke="#557c9f" stroke-width="2" marker-end="url(#a)"><path d="M268 102H306"/><path d="M564 102H602"/><path d="M860 102H898"/></g>
<g transform="translate(24 24)"><rect width="244" height="162" rx="14" fill="white" stroke="#ccdaea"/><text x="20" y="35" font-size="15" font-weight="700" fill="#247385">01 / DOWNLOAD</text><path d="M122 57V95M106 81L122 97L138 81M97 105V114H147V105" stroke="#247385" stroke-width="3" fill="none"/><text x="122" y="142" text-anchor="middle" font-size="17" fill="#17324e">Get the .dmg asset</text></g>
<g transform="translate(320 24)"><rect width="244" height="162" rx="14" fill="white" stroke="#ccdaea"/><text x="20" y="35" font-size="15" font-weight="700" fill="#247385">02 / OPEN</text><rect x="99" y="59" width="46" height="53" rx="6" fill="none" stroke="#247385" stroke-width="3"/><circle cx="122" cy="85" r="12" stroke="#247385" stroke-width="3" fill="none"/><text x="122" y="142" text-anchor="middle" font-size="17" fill="#17324e">Mount the disk image</text></g>
<g transform="translate(616 24)"><rect width="244" height="162" rx="14" fill="white" stroke="#ccdaea"/><text x="20" y="35" font-size="15" font-weight="700" fill="#247385">03 / INSTALL</text><path d="M96 72V66H117L124 73H149V110H96Z" fill="none" stroke="#247385" stroke-width="3"/><text x="122" y="142" text-anchor="middle" font-size="17" fill="#17324e">Drag to Applications</text></g>
<g transform="translate(912 24)"><rect width="264" height="162" rx="14" fill="white" stroke="#ccdaea"/><text x="20" y="35" font-size="15" font-weight="700" fill="#247385">04 / LAUNCH</text><rect x="108" y="61" width="48" height="48" rx="12" fill="#153951"/><text x="132" y="95" text-anchor="middle" font-size="29" font-weight="700" fill="white">R</text><text x="132" y="142" text-anchor="middle" font-size="17" fill="#17324e">Open Reason normally</text></g></g></svg>
